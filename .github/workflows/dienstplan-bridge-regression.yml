name: Dienstplan Bridge Regression

on:
  pull_request:
    paths:
      - 'src/core/plan-manager-bridge.js'
      - 'src/core/auto-sync.js'
      - 'src/adapters/supabase-provider.js'
      - 'supabase/migrations/**'
      - 'tools/test-plan-manager-bridge.mjs'
      - 'index.html'
      - 'update-manifest.json'
      - '.github/workflows/dienstplan-bridge-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/plan-manager-bridge.js'
      - 'src/core/auto-sync.js'
      - 'src/adapters/supabase-provider.js'
      - 'supabase/migrations/**'
      - 'tools/test-plan-manager-bridge.mjs'
      - 'index.html'
      - 'update-manifest.json'
      - '.github/workflows/dienstplan-bridge-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Sollplan-Bruecke testen
        run: node tools/test-plan-manager-bridge.mjs
      - name: Release-Manifest pruefen
        run: node tools/verify-release.mjs
