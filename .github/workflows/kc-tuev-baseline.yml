name: KC TÜV Baseline

on:
  push:
    branches: [main, twinkey-member-flow]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test tools
        run: npm ci --ignore-scripts
      - name: JavaScript syntax
        run: npm run test:tuev:syntax
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: DP2 smoke and release integrity
        run: npm run test:smoke
      - name: Python syntax
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then python -m compileall -q -x '(^|/)(\.git|node_modules)/' .; else echo 'No Python files'; fi
      - name: Python dependency audit when requirements exist
        run: |
          if [ -f requirements.txt ]; then python -m pip install --disable-pip-version-check -q pip-audit && pip-audit -r requirements.txt; else echo 'No requirements.txt; pip-audit skipped'; fi
      - name: Block obvious committed secrets
        run: |
          if git grep -I -n -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|DATABASE_URL[[:space:]]*=[[:space:]]*postgres)' -- ':!*.md' ':!*.example' ':!*.sample'; then echo 'Potential committed secret found'; exit 1; else echo 'No obvious committed secret pattern found'; fi