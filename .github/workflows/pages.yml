name: KC DP2 auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release vollständig prüfen
        run: |
          node tools/verify-release.mjs
          node tools/smoke-core.mjs
          node tools/smoke-plan-transfer.mjs
          node tools/smoke-wish-demand.mjs

      - name: Neue Buildnummer erzwingen
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          CURRENT_BUILD=$(node -p "require('./update-manifest.json').build")
          PREVIOUS_BUILD=$(git show HEAD^:update-manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).build))")
          if [ "$CURRENT_BUILD" -le "$PREVIOUS_BUILD" ]; then
            echo "Fehler: Jede Veröffentlichung benötigt eine höhere Buildnummer. Vorher: $PREVIOUS_BUILD, aktuell: $CURRENT_BUILD"
            exit 1
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische PWA verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veröffentlichungspaket auf GitHub abwarten
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$COUNT" -eq 1 ]; then
                echo "Veröffentlichungspaket ist verfügbar."
                exit 0
              fi
            fi
            echo "GitHub stellt das Veröffentlichungspaket noch bereit (Versuch $attempt/12)."
            sleep 5
          done
          echo "Veröffentlichungspaket nicht rechtzeitig verfügbar. Die bisherige Version bleibt aktiv."
          exit 1

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
