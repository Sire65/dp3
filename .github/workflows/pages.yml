name: KC DP2 auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Release vollständig prüfen
        run: |
          node tools/verify-release.mjs
          node tools/smoke-core.mjs
          node tools/smoke-plan-transfer.mjs
          node tools/smoke-wish-demand.mjs

      - name: Neue Buildnummer erzwingen
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          CURRENT_BUILD=$(node -p "require('./update-manifest.json').build")
          PREVIOUS_BUILD=$(git show HEAD^:update-manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).build))")
          if [ "$CURRENT_BUILD" -le "$PREVIOUS_BUILD" ]; then
            echo "Fehler: Jede Veröffentlichung benötigt eine höhere Buildnummer. Vorher: $PREVIOUS_BUILD, aktuell: $CURRENT_BUILD"
            exit 1
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Statische PWA verpacken
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
