name: KC DP2 auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release vollständig prüfen
        run: |
          node tools/verify-release.mjs
          node tools/smoke-core.mjs

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische PWA verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

