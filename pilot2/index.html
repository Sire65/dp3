<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#741521"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KC DP2">
<title>KC DP2</title>
<script>(function(){const i=/iPhone|iPad|iPod/i.test(navigator.userAgent||''),l=document.createElement('link');l.rel='manifest';l.href=(i?'manifest-ios.webmanifest':'manifest.webmanifest')+'?v=simple1';document.head.appendChild(l)})();</script>
<link rel="apple-touch-icon" href="../assets/kc-dp2-apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff8ee;color:#2a2020}.wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(520px,100%);background:white;border:1px solid #ead7d7;border-radius:22px;padding:24px;box-shadow:0 8px 30px #0001;text-align:center}.logo{width:78px;height:78px;border-radius:18px}.title{font-size:28px;margin:10px 0 4px}.sub{color:#6d5a5a;margin:0 0 22px}.big{width:100%;border:0;border-radius:16px;padding:19px 16px;background:#741521;color:white;font-size:20px;font-weight:800}.big:disabled{opacity:.5}.steps{text-align:left;background:#fff4e9;border-radius:16px;padding:18px;margin-top:16px;font-size:20px;line-height:1.55}.ok{font-size:54px}.muted{color:#766;font-size:14px;margin-top:14px}.hide{display:none}.status{margin-top:16px;font-weight:700}.warn{background:#fff0f0;padding:13px;border-radius:12px;color:#7b1620}
</style></head><body><main class="wrap"><section class="card">
<img class="logo" src="../assets/kc-dp2-apple-touch-icon.png" alt="KC DP2"><h1 class="title">KC DP2</h1><p class="sub" id="hello">Install-Test</p>
<div id="loading" class="status">Wird vorbereitet …</div>
<div id="iosInstall" class="hide"><div class="steps"><b>Nur einmal:</b><br>1. Unten rechts <b>•••</b> antippen<br>2. <b>Zum Home-Bildschirm</b><br>3. <b>Hinzufügen</b><br><br>Danach <b>KC DP2</b> öffnen.</div></div>
<div id="startBox" class="hide"><button id="start" class="big">Push erlauben & fertig</button><div class="muted">Danach läuft der Test automatisch.</div></div>
<div id="androidInstall" class="hide"><button id="install" class="big">App installieren</button></div>
<div id="done" class="hide"><div class="ok">✅</div><h2>Fertig</h2><p>Installation und Push wurden geprüft.</p></div>
<div id="error" class="hide warn"></div>
</section></main>
<script>
(()=>{
 const END='https://ptblnpiroqftcvlsrhac.supabase.co/functions/v1/kc-dp-pilot',KEY='kc_dp_pilot2_token',BUILD='0.19.51-simple1';
 const $=id=>document.getElementById(id),ios=/iPhone|iPad|iPod/i.test(navigator.userAgent||''),android=/Android/i.test(navigator.userAgent||''),standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 let server=null,deferred=null,subscribed=false;
 const u=new URL(location.href),q=u.searchParams.get('pilot');if(q&&q.length>=32)localStorage.setItem(KEY,q);const token=()=>q||localStorage.getItem(KEY)||'';
 const show=id=>$(id).classList.remove('hide'),hide=id=>$(id).classList.add('hide');
 function fail(x){hide('loading');hide('startBox');hide('androidInstall');$('error').textContent=x?.message||String(x);show('error')}
 async function call(action,p={}){const t=token();if(!t)throw Error('Persönlicher Zugang fehlt.');const r=await fetch(END,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:t,device:'handy:'+(ios?'ios':android?'android':'other'),deviceClass:'handy',installed:standalone(),notification:typeof Notification==='undefined'?'unsupported':Notification.permission,targetVersion:'0.19.51',pilotBuild:BUILD,...p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Verbindung fehlgeschlagen');return d}
 function b64u(s){const pad='='.repeat((4-s.length%4)%4),raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a}
 async function inventory(){let oldSub=null,workers=0,cachesFound=[];try{const regs=await navigator.serviceWorker.getRegistrations();workers=regs.length;for(const r of regs){try{const s=await r.pushManager.getSubscription();if(s){oldSub=s;break}}catch(_){}}}catch(_){}try{cachesFound=(await caches.keys()).filter(x=>/kc-dp|pilot/i.test(x)).slice(0,12)}catch(_){}await call('heartbeat',{phase:'pilot2_inventory',existingFound:!!(oldSub||workers||cachesFound.length),existingInstalled:!!oldSub,hasPushSubscription:!!oldSub,installDisposition:oldSub?'reuse':'new',selectedDeviceClass:'handy'}).catch(()=>{});return oldSub}
 async function context(reg){const sw=reg.active||navigator.serviceWorker.controller;if(!sw)return;await new Promise(res=>{const ch=new MessageChannel(),tm=setTimeout(res,900);ch.port1.onmessage=()=>{clearTimeout(tm);res()};sw.postMessage({type:'KC_DP_PILOT2_CONTEXT',ctx:{token:token(),device:ios?'ios':android?'android':'other'}},[ch.port2])})}
 async function subscribe(existing=null){if(subscribed)return;const reg=await navigator.serviceWorker.register('./sw.js?v=simple1',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;let sub=existing;if(!sub)sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(server.vapidPublicKey)});await context(reg);await call('subscribe',{subscription:sub.toJSON?sub.toJSON():sub,userAgent:navigator.userAgent});subscribed=true}
 async function waitDone(){for(let i=0;i<25;i++){await new Promise(r=>setTimeout(r,1200));const s=await call('bootstrap');if(['test_received','completed'].includes(String(s.status||''))){hide('loading');hide('startBox');hide('androidInstall');show('done');return}}$('loading').textContent='Push wurde gesendet. Empfang wird weiter geprüft.'}
 async function send(){const r=await call('send_test');if(!(r.sent>0))throw Error('Push konnte nicht zugestellt werden.');$('loading').textContent='Push wird geprüft …';show('loading');waitDone().catch(fail)}
 async function finish(existing=null){if(typeof Notification==='undefined')throw Error('Push ist hier noch nicht verfügbar.');if(Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted')throw Error('Bitte bei Push „Erlauben“ wählen.')}await subscribe(existing);if(standalone())await call('installed',{installedVersion:'0.19.51',pilotBuild:BUILD,installDisposition:existing?'reuse':'new'}).catch(()=>{});await send()}
 async function boot(){try{server=await call('bootstrap');$('hello').textContent='Hallo '+(server.firstName||'')+' · Install-Test';const existing=await inventory();if(existing){hide('loading');show('startBox');$('start').onclick=()=>{hide('startBox');show('loading');finish(existing).catch(fail)};return}if(ios&&!standalone()){hide('loading');show('iosInstall');return}if(standalone()){hide('loading');show('startBox');$('start').onclick=()=>{hide('startBox');show('loading');finish().catch(fail)};return}if(android){hide('loading');show('startBox');$('start').textContent='Push erlauben & installieren';$('start').onclick=async()=>{try{hide('startBox');show('loading');if(typeof Notification!=='undefined'&&Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted')throw Error('Bitte bei Push „Erlauben“ wählen.')}await subscribe();if(deferred){await deferred.prompt();const c=await deferred.userChoice;if(c.outcome!=='accepted')throw Error('Installation wurde nicht bestätigt.');return}hide('loading');show('androidInstall')}catch(e){fail(e)}};return}hide('loading');show('startBox');$('start').onclick=()=>finish().catch(fail)}catch(e){fail(e)}}
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});window.addEventListener('appinstalled',async()=>{hide('androidInstall');show('loading');try{await call('installed',{installedVersion:'0.19.51',pilotBuild:BUILD,installDisposition:'new'});await send()}catch(e){fail(e)}});$('install').onclick=async()=>{try{if(!deferred)throw Error('Browser-Menü → App installieren.');await deferred.prompt()}catch(e){fail(e)}};boot();
})();
</script></body></html>
