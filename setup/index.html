<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#741521"><title>KC DP2 einrichten</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f3f0;color:#251d1e}.shell{min-height:100dvh;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}.card{width:min(100%,620px);max-height:calc(100dvh - 20px);background:#fff;border:1px solid #e4d9d6;border-radius:18px;padding:14px;box-shadow:0 8px 28px #3a1d2220;display:flex;flex-direction:column;gap:10px;overflow:hidden}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:10px}.brand h1{font-size:20px;margin:0;color:#741521}.brand p,.hint{margin:2px 0 0;font-size:12px;color:#6d6264}.question{font-weight:750;font-size:15px}.devices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.device{border:1.5px solid #d9cbca;background:#fff;border-radius:12px;padding:9px 4px;min-height:70px;font-weight:700;color:#493c3e}.device span{display:block;font-size:25px;margin-bottom:3px}.device small{display:block;font-size:10px;font-weight:500;color:#766b6d}.device.active{border-color:#741521;background:#fff6f6;color:#741521;box-shadow:inset 0 0 0 1px #741521}.panel{background:#f8f5f3;border-radius:12px;padding:10px;min-height:126px;display:flex;flex-direction:column;justify-content:center}.panel h2{font-size:15px;margin:0 0 5px}.steps{margin:0;padding-left:20px;font-size:13px;line-height:1.42}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:750;font-size:13px;background:#741521;color:#fff}.btn.secondary{background:#eee8e6;color:#4c4042}.progress{height:5px;background:#eee7e5;border-radius:9px;overflow:hidden}.progress i{display:block;width:33%;height:100%;background:#741521;border-radius:9px}@media(max-height:680px){.card{gap:7px;padding:10px}.brand img{width:36px;height:36px}.brand h1{font-size:17px}.devices{gap:5px}.device{min-height:58px;padding:5px 2px}.device span{font-size:21px}.panel{min-height:100px;padding:8px}.steps{font-size:12px;line-height:1.3}.btn{padding:9px 6px}.hint{font-size:10px}}@media(max-width:350px){.device{font-size:11px}.device small{display:none}}
</style></head><body><main class="shell"><section class="card"><div class="brand"><img src="../assets/kc-dp2-apple-touch-icon.png" alt="KC DP2"><div><h1>KC DP2 einrichten</h1><p>Ein Link · mehrere eigene Geräte</p></div></div><div class="progress"><i id="progress"></i></div><div class="question">Auf welchem Gerät möchten Sie KC Dienstplan einrichten?</div><div class="devices"><button class="device" data-device="phone"><span>📱</span>Handy<small>iPhone / Android</small></button><button class="device" data-device="tablet"><span>📲</span>Tablet<small>iPad / Android</small></button><button class="device" data-device="pc"><span>💻</span>PC / Notebook<small>Windows / Mac</small></button></div><section class="panel"><h2 id="title">Gerät auswählen</h2><ol class="steps" id="steps"><li>Gerät antippen.</li><li>Wir zeigen nur die passenden Schritte.</li></ol></section><div class="actions"><button class="btn secondary" id="other">＋ Weiteres Gerät</button><button class="btn" id="continue" disabled>Weiter</button></div><p class="hint" id="hint">Das erkannte Gerät wird vorgeschlagen. Sie können die Auswahl jederzeit ändern.</p></section></main><script>
(()=>{const ua=navigator.userAgent||'',touch=navigator.maxTouchPoints||0,w=Math.min(screen.width||innerWidth,screen.height||innerHeight);let detected=/iPad|Tablet/i.test(ua)||(touch>1&&w>=600)?'tablet':/Mobile|iPhone|Android/i.test(ua)?'phone':'pc';let selected='';const data={phone:{t:'Handy einrichten',s:['Passende Installation für iPhone oder Android öffnen.','Mit Ihrem KC-Zugang anmelden.','Benachrichtigungen auf diesem Handy freigeben.']},tablet:{t:'Tablet einrichten',s:['Passende Installation für iPad oder Android-Tablet öffnen.','Mit Ihrem KC-Zugang anmelden.','Benachrichtigungen auf diesem Tablet freigeben.']},pc:{t:'PC / Notebook einrichten',s:['KC DP2 im unterstützten Browser öffnen und installieren.','Mit Ihrem KC-Zugang anmelden.','Benachrichtigungen auf diesem PC optional freigeben.']}};const buttons=[...document.querySelectorAll('.device')],title=document.querySelector('#title'),steps=document.querySelector('#steps'),cont=document.querySelector('#continue'),hint=document.querySelector('#hint');function choose(v,auto=false){selected=v;buttons.forEach(b=>b.classList.toggle('active',b.dataset.device===v));title.textContent=data[v].t;steps.innerHTML=data[v].s.map(x=>'<li>'+x+'</li>').join('');cont.disabled=false;hint.textContent=(auto?'Dieses Gerät wurde automatisch erkannt. ':'')+'Bei Bedarf können Sie eine andere Geräteart wählen.'}buttons.forEach(b=>b.onclick=()=>choose(b.dataset.device));choose(detected,true);document.querySelector('#other').onclick=()=>{selected='';buttons.forEach(b=>b.classList.remove('active'));title.textContent='Weiteres Gerät auswählen';steps.innerHTML='<li>Handy, Tablet oder PC antippen.</li><li>Der gleiche persönliche Einrichtungslink kann erneut verwendet werden.</li>';cont.disabled=true};cont.onclick=()=>{if(!selected)return;sessionStorage.setItem('kcdpSetupDevice',selected);location.href='../?setup=1&device='+encodeURIComponent(selected)};})();
</script></body></html>
