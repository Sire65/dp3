<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DP2 Start wiederherstellen</title><body style="font:20px system-ui;max-width:650px;margin:40px auto;padding:20px"><h1>DP2 starten</h1><p>Bitte andere DP2-Tabs vorher schließen. Es werden nur Programmdateien im Browsercache entfernt. Deine gespeicherten Plandaten bleiben erhalten.</p><button id="repair" style="font:inherit;padding:16px">DP2-Start wiederherstellen</button><p id="status" role="status"></p><script>
document.getElementById('repair').onclick=async()=>{const button=document.getElementById('repair'),status=document.getElementById('status');button.disabled=true;try{status.textContent='Programmstand wird geprüft …';const response=await fetch('index.html?kc_update='+Date.now(),{cache:'no-store'});const html=await response.text();if(!response.ok||!html.includes('KC_DP_BUILD=279'))throw Error('Aktueller Programmstand im Startordner fehlt. Keine Änderung vorgenommen.');for(const reg of await navigator.serviceWorker.getRegistrations()){if(reg.scope===new URL('./',location.href).href)await reg.unregister();}for(const name of await caches.keys()){if(name.startsWith('kc-dp-release-'))await caches.delete(name);}localStorage.removeItem('kc_dp_staged_release');status.textContent='Programmcache erneuert. DP2 öffnet sich.';location.replace('index.html?start=279');}catch(e){status.textContent=e.message;button.disabled=false;}};
</script></body></html>
